name: Deploy React Vite Nativo

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: |
          cd NOME_DA_cell-population-curator
          npm install

      - name: Build do Vite
        run: |
          cd NOME_DA_cell-population-curator
          npm run build

      - name: Upload do resultado
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'NOME_DA_cell-population-curator/dist' # O Vite joga o site pronto na pasta dist

      - name: Deploy para o GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4